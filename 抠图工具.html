<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smile 图片抠图工具</title>
    <style>
:root {
  color-scheme: dark;
  --page: #07101f;
  --panel: #10203a;
  --panel-2: #132b4b;
  --line: #22446d;
  --muted: #8ea8c7;
  --text: #edf6ff;
  --cyan: #27b8ff;
  --green: #18c78d;
  --red: #ff4d65;
  --orange: #f0a321;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
  background: radial-gradient(circle at top left, #10213d 0, var(--page) 42%, #050914 100%);
  color: var(--text);
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.app-shell {
  width: min(1420px, calc(100vw - 32px));
  margin: 22px auto;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 18px 22px;
  border: 1px solid var(--line);
  border-radius: 8px 8px 0 0;
  background: #101d37;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.brand-avatar {
  width: 54px;
  height: 54px;
  flex: 0 0 auto;
  object-fit: cover;
  border: 1px solid #2d5b89;
  border-radius: 8px;
  background: #0b1628;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
}
.brand-avatar::after {
  content: "🎨";
}

.eyebrow {
  margin: 0 0 5px;
  color: var(--cyan);
  font-size: 14px;
  font-weight: 700;
}

h1,
h2 {
  margin: 0;
}

h1 {
  font-size: 22px;
}

.version-badge {
  margin-left: 10px;
  color: #f6b73c;
  font-size: 15px;
  font-weight: 800;
  vertical-align: 2px;
}

h2 {
  font-size: 15px;
}

.top-actions,
.export-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.export-actions .ghost {
  flex: 1 1 120px;
}

.primary-file,
.nav-link,
button {
  min-height: 36px;
  border-radius: 7px;
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: white;
  background: #1c3f69;
  border: 1px solid #2c5c8e;
}

.primary-file {
  background: linear-gradient(180deg, #25bdf8, #1289d4);
  border-color: #2ed0ff;
  font-weight: 700;
}

.nav-link {
  text-decoration: none;
  background: #152642;
}

.top-actions .primary-file {
  min-width: 132px;
  min-height: 44px;
  padding: 0 24px;
  font-size: 15px;
  box-shadow: 0 0 0 1px rgba(39, 184, 255, 0.18), 0 10px 24px rgba(18, 137, 212, 0.18);
}

.top-actions .nav-link {
  min-height: 44px;
  padding: 0 18px;
}

.toolkit-home {
  min-height: calc(100vh - 44px);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

.toolkit-panel {
  padding: 14px;
  border-inline: 1px solid var(--line);
  background: #0d1a31;
}

.toolkit-table-header,
.tool-row {
  display: grid;
  grid-template-columns: 64px minmax(160px, 220px) minmax(280px, 1fr) 110px 150px;
  gap: 14px;
  align-items: center;
}

.toolkit-table-header {
  min-height: 38px;
  padding: 0 14px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  border: 1px solid #24486f;
  border-radius: 8px 8px 0 0;
  background: #0b1628;
}

.tool-row {
  min-height: 76px;
  padding: 12px 14px;
  color: var(--text);
  text-decoration: none;
  border-inline: 1px solid #24486f;
  border-bottom: 1px solid #24486f;
  background: #10203a;
}

.tool-row:last-child {
  border-radius: 0 0 8px 8px;
}

.tool-row:hover {
  background: #132b4b;
}

.tool-open-link {
  color: var(--text);
  font-size: 16px;
  font-weight: 800;
  text-decoration: none;
}

.tool-open-link:hover {
  color: #55d6ff;
}

.tool-open-link:focus-visible,
.tool-guide-trigger:focus-visible,
.release-log-trigger:focus-visible,
.modal-close:focus-visible {
  outline: 2px solid #7bdcff;
  outline-offset: 3px;
}

.tool-row time {
  color: #b9d7ff;
  font-size: 13px;
  line-height: 1.45;
}

.tool-guide-trigger {
  min-height: 0;
  padding: 0;
  display: block;
  color: #b9d7ff;
  background: transparent;
  border: 0;
  border-radius: 4px;
  font-size: 13px;
  line-height: 1.55;
  text-align: left;
}

.tool-guide-trigger > span {
  display: inline-block;
  margin-left: 8px;
  color: var(--cyan);
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

.tool-guide-trigger:hover {
  color: white;
}

.release-log-trigger {
  min-width: 280px;
  min-height: 52px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  border-color: #2f638f;
  background: #0c1a30;
  box-shadow: inset 3px 0 0 var(--cyan);
}

.release-log-trigger span {
  font-weight: 800;
}

.release-log-trigger strong {
  color: #f6b73c;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.release-log-trigger:hover {
  border-color: var(--cyan);
  background: #142b49;
}

.tool-icon {
  width: 42px;
  height: 42px;
  display: inline-grid;
  place-items: center;
  border: 1px solid #2ed0ff;
  border-radius: 8px;
  color: #ffffff;
  background: #1289d4;
  font-weight: 800;
}

.toolkit-footer {
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 18px;
  color: var(--muted);
  font-size: 13px;
  border: 1px solid var(--line);
  border-radius: 0 0 8px 8px;
  background: #101d37;
}

.support-stats {
  position: fixed;
  right: 18px;
  top: 132px;
  z-index: 20;
  min-width: 168px;
  padding: 12px 14px;
  border: 1px solid #2d5b89;
  border-radius: 8px;
  color: #b9d7ff;
  background: rgba(13, 28, 52, 0.94);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
  font-size: 13px;
  line-height: 1.8;
}

.support-stats strong {
  color: #f6b73c;
}

.entry-modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(5, 9, 20, 0.76);
  backdrop-filter: blur(6px);
}

.entry-modal.is-hidden {
  display: none;
}

.entry-modal-card {
  width: min(460px, calc(100vw - 36px));
  padding: 24px;
  border: 1px solid #2d5b89;
  border-radius: 8px;
  background: #10203a;
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.38);
  text-align: center;
}

.entry-modal-card h2 {
  font-size: 22px;
}

.entry-modal-card p {
  margin: 18px 0 22px;
  color: #d8eaff;
  font-size: 16px;
  line-height: 1.6;
}

.entry-modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.entry-modal-actions button,
.qr-card button {
  min-height: 42px;
  font-weight: 800;
}

.qr-card img {
  width: min(320px, 82vw);
  display: block;
  margin: 18px auto;
  border-radius: 8px;
}

.primary-file input {
  display: none;
}

.matting-app {
  height: calc(100vh - 44px);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  overflow: hidden;
}

.matting-app .topbar {
  min-height: 92px;
}

.matting-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  min-height: 0;
  height: 100%;
  border-inline: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: #0d1a31;
}

.matting-stage {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 8px;
  padding: 12px;
  border-right: 1px solid var(--line);
  background: var(--panel);
}

.matting-pathbar {
  min-height: 70px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 8px 12px;
  border: 1px solid #24486f;
  border-radius: 7px;
  background: #0d1c34;
}

.matting-pathbar span,
.matting-pathbar em {
  color: var(--muted);
  font-size: 12px;
  font-style: normal;
  white-space: nowrap;
}

.matting-pathbar strong {
  min-width: 120px;
  flex: 0 1 auto;
  max-width: min(520px, 48vw);
  overflow: hidden;
  color: var(--text);
  font-size: 13px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.matting-toolbar-row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}

.preview-toolbar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.mask-paint-toolbar {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: 0 0 auto;
}

.mask-paint-toolbar .compact-btn {
  padding: 0 9px;
  white-space: nowrap;
}

.mask-tool-btn.is-active {
  border-color: #28bff2;
  background: #12658a;
  color: #fff;
}

.mask-tool-erase.is-active {
  border-color: #ff657b;
  background: #8f3041;
}

.matting-drop-zone.is-magic-wand #resultCanvas {
  cursor: crosshair;
}

.brush-size-control {
  min-width: 142px;
  display: inline-grid;
  grid-template-columns: auto 82px 28px;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.brush-size-control input {
  width: 82px;
  min-width: 0;
  margin: 0;
}

.brush-size-control output {
  color: var(--text);
  text-align: right;
}

.preview-toolbar .compact-btn {
  min-width: 76px;
  padding: 0 10px;
  white-space: nowrap;
}

.preview-toolbar .preview-color {
  width: 30px;
  height: 30px;
  min-width: 30px;
  margin: 0;
  padding: 2px;
  flex: 0 0 auto;
}

.preview-color.is-hidden {
  display: none;
}

.matting-drop-zone {
  position: relative;
  min-height: 0;
  height: 100%;
  padding: 10px;
  border-radius: 7px;
  overflow: hidden;
  background:
    linear-gradient(45deg, #26374f 25%, transparent 25%),
    linear-gradient(-45deg, #26374f 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #26374f 75%),
    linear-gradient(-45deg, transparent 75%, #26374f 75%);
  background-color: #17253c;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  background-size: 20px 20px;
  outline: 1px solid #1d3b60;
}

.matting-drop-zone.is-panning #resultCanvas {
  cursor: grabbing;
}

.matting-drop-zone.is-masking #resultCanvas {
  cursor: crosshair;
}

.matting-drop-zone.dragover {
  outline-color: var(--cyan);
}

#sourceCanvas,
#resultCanvas,
#protectCanvas,
#alphaCanvas {
  height: auto;
  display: block;
}

#resultCanvas,
#protectCanvas {
  width: auto;
  max-width: none;
  max-height: none;
  position: absolute;
  left: 50%;
  top: 50%;
  border: 1px solid #2d5b89;
  border-radius: 7px;
  cursor: grab;
  transform-origin: center center;
  will-change: transform;
}

#protectCanvas {
  pointer-events: none;
  border-color: transparent;
}

.hidden-canvas {
  display: none !important;
}

/* AI background removal */
.ai-matting-app {
  min-height: calc(100dvh - 44px);
  display: grid;
  grid-template-rows: auto auto minmax(480px, 1fr);
  overflow: hidden;
}

.ai-matting-toolbar {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(360px, 1.3fr) auto auto;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-inline: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: #0d1a31;
}

.ai-file-summary,
.ai-model-summary {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.ai-file-summary span,
.ai-file-summary em,
.ai-model-summary > span:not(.ai-backend-badge) {
  color: var(--muted);
  font-size: 12px;
  font-style: normal;
  white-space: nowrap;
}

.ai-file-summary strong {
  min-width: 0;
  overflow: hidden;
  color: var(--text);
  font-size: 13px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ai-backend-badge {
  padding: 4px 7px;
  border: 1px solid #2c6e9b;
  border-radius: 5px;
  color: #79d5ff;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.ai-progress-track {
  min-width: 100px;
  height: 6px;
  flex: 1;
  overflow: hidden;
  border-radius: 3px;
  background: #071326;
  outline: 1px solid #27496e;
}

.ai-progress-track span {
  width: 0;
  height: 100%;
  display: block;
  background: #29bdf2;
  transition: width 160ms ease;
}

.ai-model-summary output {
  width: 34px;
  color: var(--text);
  font-size: 12px;
  text-align: right;
}

.ai-run-btn {
  min-width: 132px;
}

.ai-matting-controls {
  display: grid;
  grid-template-columns: repeat(4, minmax(150px, 1fr)) auto;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  border-inline: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: #0b172b;
}

.ai-matting-controls label {
  display: grid;
  grid-template-columns: auto minmax(70px, 1fr) 28px;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.ai-matting-controls input {
  min-width: 0;
  margin: 0;
}

.ai-matting-controls output {
  color: var(--text);
  text-align: right;
}

.ai-matting-app button:disabled,
.ai-matting-app input:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}

.ai-matting-workspace {
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  padding: 10px;
  border-inline: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}

.ai-preview-panel {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: 44px minmax(0, 1fr);
  overflow: hidden;
  border: 1px solid #24486f;
  border-radius: 7px;
  background: #0d1c34;
}

.ai-preview-panel > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 12px;
  border-bottom: 1px solid #24486f;
}

.ai-preview-panel h2 {
  margin: 0;
  font-size: 14px;
}

.ai-preview-panel header span {
  color: var(--muted);
  font-size: 12px;
}

.ai-preview-stage {
  position: relative;
  min-height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 14px;
  background: #081426;
}

.ai-preview-stage.checker-stage {
  background:
    linear-gradient(45deg, #26374f 25%, transparent 25%),
    linear-gradient(-45deg, #26374f 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #26374f 75%),
    linear-gradient(-45deg, transparent 75%, #26374f 75%);
  background-color: #17253c;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  background-size: 20px 20px;
}

.ai-preview-stage.dragover {
  outline: 2px solid var(--cyan);
  outline-offset: -3px;
}

.ai-preview-stage canvas {
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  display: block;
  object-fit: contain;
}

.ai-preview-stage canvas.is-hidden,
.ai-preview-stage .empty-state.is-hidden {
  display: none;
}

.ai-download-card {
  width: min(520px, calc(100vw - 36px));
  text-align: left;
}

.ai-download-card p {
  color: var(--muted);
  line-height: 1.7;
}

.ai-is-busy .ai-preview-stage canvas {
  opacity: 0.72;
}

@media (max-width: 980px) {
  .ai-matting-app {
    overflow: visible;
  }

  .ai-matting-toolbar {
    grid-template-columns: 1fr 1fr;
  }

  .ai-matting-controls {
    grid-template-columns: 1fr 1fr;
  }

  .ai-file-summary,
  .ai-model-summary {
    grid-column: 1 / -1;
  }

  .ai-matting-workspace {
    grid-template-columns: 1fr;
  }

  .ai-preview-panel {
    min-height: 480px;
  }
}

#resultCanvas.is-hidden {
  display: none;
}

.matting-side {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100%;
  max-height: 100%;
  overflow: auto;
  padding: 12px;
  background: var(--panel);
}

.matting-app .side-settings {
  margin-bottom: 12px;
}

.matting-app .settings-panel {
  padding: 12px;
}

.matting-app .matting-settings-grid {
  gap: 4px;
}

.info-modal-card {
  width: min(760px, calc(100vw - 36px));
  max-height: min(780px, calc(100dvh - 40px));
  padding: 0;
  overflow: hidden;
  text-align: left;
}

.info-modal-header {
  min-height: 86px;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid var(--line);
  background: #0d1a31;
}

.info-modal-header .eyebrow {
  margin-bottom: 5px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.info-modal-header h2 {
  font-size: 21px;
}

.modal-close {
  width: 38px;
  min-width: 38px;
  min-height: 38px;
  padding: 0;
  border-radius: 6px;
  color: #b9d7ff;
  background: #142844;
  font-size: 24px;
  line-height: 1;
}

.release-summary {
  margin: 18px 20px 0;
  padding: 14px 16px;
  display: grid;
  gap: 5px;
  border: 1px solid #28547e;
  border-left: 3px solid var(--cyan);
  border-radius: 7px;
  background: #0b1628;
}

.release-summary strong {
  color: white;
}

.release-summary span {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.version-tree {
  max-height: calc(100dvh - 260px);
  margin: 0;
  padding: 18px 24px 24px 88px;
  overflow: auto;
  list-style: none;
}

.version-tree li {
  position: relative;
  min-height: 72px;
  padding: 0 0 22px 30px;
  border-left: 1px solid #315a80;
}

.version-tree li:last-child {
  border-left-color: transparent;
  padding-bottom: 0;
}

.version-tree li::before {
  content: "";
  position: absolute;
  top: 3px;
  left: -6px;
  width: 11px;
  height: 11px;
  border: 2px solid #0d1a31;
  border-radius: 50%;
  background: #6c8baa;
  box-shadow: 0 0 0 1px #315a80;
}

.version-tree li.is-feature::before {
  background: var(--cyan);
  box-shadow: 0 0 0 1px var(--cyan), 0 0 14px rgba(39, 184, 255, 0.35);
}

.version-tree li.is-doc::before {
  background: #f6b73c;
  box-shadow: 0 0 0 1px #f6b73c;
}

.version-tree li > span {
  position: absolute;
  top: -1px;
  left: -76px;
  color: #8fb1d4;
  font: 700 11px/1.5 Consolas, monospace;
}

.version-tree li strong {
  color: white;
  font-size: 14px;
}

.version-tree li p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.guide-modal-body {
  max-height: calc(100dvh - 150px);
  padding: 20px;
  overflow: auto;
}

.guide-steps {
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  list-style: none;
  counter-reset: guide-step;
}

.guide-steps li {
  position: relative;
  min-height: 92px;
  padding: 14px 14px 14px 48px;
  border: 1px solid #24486f;
  border-radius: 7px;
  background: #0d1a31;
  counter-increment: guide-step;
}

  min-height: 0;
  padding: 14px;
  overflow: auto;
  background: #07101f;
  grid-row: 2;
}

.compress-compare-stage {
  position: relative;
  width: 100%;
  height: var(--compress-preview-stage-height);
  min-height: var(--compress-preview-stage-height);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: inherit;
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.compress-compare-stage > img,
.compress-compare-result,
.compress-compare-result img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.compress-compare-stage > img,
.compress-compare-result img {
  object-fit: contain;
  pointer-events: none;
  transform: translate(var(--preview-pan-x, 0), var(--preview-pan-y, 0)) scale(var(--preview-scale, 1));
  transform-origin: center;
}

.compress-compare-stage.is-panning,
.compress-image-stage.is-panning {
  cursor: grabbing;
}

.compress-compare-result {
  overflow: hidden;
  background: inherit;
}

.compress-compare-divider {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 3px;
  min-height: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: white;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
  transform: translateX(-50%);
  z-index: 5;
  cursor: ew-resize;
  touch-action: none;
}

.compress-compare-divider span {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 2px solid white;
  border-radius: 50%;
  color: white;
  background: #1289d4;
  box-shadow: 0 5px 18px rgba(0, 0, 0, 0.35);
  transform: translate(-50%, -50%);
  font-size: 18px;
}

.compress-compare-label {
  position: absolute;
  top: 12px;
  z-index: 4;
  padding: 5px 8px;
  border-radius: 5px;
  color: white;
  background: rgba(7, 16, 31, 0.78);
  font-size: 11px;
  font-weight: 800;
  pointer-events: none;
}

.compress-compare-label.original-label {
  left: 12px;
}

.compress-compare-label.result-label {
  right: 12px;
}

.compress-compare-stage .empty-state {
  position: absolute;
  inset: 0;
  z-index: 3;
}

.preview-bg-dark {
  background: #07101f !important;
  background-image: none !important;
}

.preview-bg-light {
  background: #f4f7fb !important;
  background-image: none !important;
}

.compress-preview-card {
  min-width: 0;
  min-height: 0;
  margin: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: #10203a;
}

.compress-preview-card figcaption {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  color: #cce6ff;
  font-size: 12px;
  font-weight: 800;
}

.compress-preview-card p {
  min-height: 36px;
  margin: 0;
  padding: 10px 12px;
  border-top: 1px solid var(--line);
}

.compress-image-stage {
  position: relative;
  height: var(--compress-preview-stage-height);
  min-height: var(--compress-preview-stage-height);
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #07101f;
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.compress-image-stage.checkerboard {
  background-color: #e2e8f0;
  background-image: linear-gradient(45deg, #cbd5e1 25%, transparent 25%), linear-gradient(-45deg, #cbd5e1 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #cbd5e1 75%), linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  background-size: 16px 16px;
}

.compress-image-stage img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  transform: translate(var(--preview-pan-x, 0), var(--preview-pan-y, 0)) scale(var(--preview-scale, 1));
  transform-origin: center;
}

.compress-image-stage .empty-state {
  padding: 20px;
  color: var(--muted);
}

.compress-settings-panel {
  overflow: auto;
  padding: 12px;
  border-left: 1px solid var(--line);
  background: #0d1a31;
}

.compress-settings-panel .settings-panel + .settings-panel {
  margin-top: 12px;
}

.compress-presets {
  display: grid;
  gap: 8px;
}

.compress-preset {
  min-height: 78px;
  padding: 11px 12px;
  display: grid;
  justify-items: start;
  gap: 4px;
  text-align: left;
  border: 1px solid #24486f;
  background: #0b1628;
}

.compress-preset:hover,
.compress-preset.is-active {
  border-color: var(--cyan);
  background: #153252;
}

.compress-preset strong {
  color: white;
  font-size: 13px;
}

.compress-preset span {
  color: #b9d7ff;
  font-size: 11px;
  line-height: 1.45;
}

.compress-preset em {
  color: #f6b73c;
  font-size: 10px;
  font-style: normal;
}

.compress-options {
  display: grid;
  gap: 11px;
}

.compress-options > label {
  display: grid;
  gap: 7px;
}

.compress-simple-panel {
  display: block;
}

.compress-simple-steps {
  display: grid;
  gap: 12px;
}

.compress-simple-steps .section-title > span {
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
}

.compress-simple-steps ol {
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
  list-style: none;
  counter-reset: compress-step;
}

.compress-simple-steps li {
  counter-increment: compress-step;
  min-height: 58px;
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  align-content: center;
  gap: 3px 9px;
  padding: 9px 10px;
  border: 1px solid #24486f;
  border-radius: 7px;
  background: #0b1628;
}

.compress-simple-steps li::before {
  content: counter(compress-step);
  grid-row: 1 / 3;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  align-self: center;
  border-radius: 50%;
  color: white;
  background: #1289d4;
  font-size: 12px;
  font-weight: 800;
}

.compress-simple-steps li strong {
  color: white;
  font-size: 12px;
}

.compress-simple-steps li span,
.compress-folder-status {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.45;
}

.compress-simple-steps > button {
  width: 100%;
  min-height: 44px;
  font-weight: 800;
}

.compress-target-format {
  display: grid;
  gap: 7px;
  color: #cce6ff;
  font-size: 12px;
  font-weight: 700;
}

.compress-strength-control,
.compress-resize-control {
  display: grid;
  gap: 7px;
  padding: 10px;
  border: 1px solid #24486f;
  border-radius: 7px;
  color: #cce6ff;
  background: #0b1628;
  font-size: 12px;
  font-weight: 700;
}

.compress-resize-control label {
  display: grid;
  gap: 7px;
}

.compress-strength-control > span,
.compress-resize-control label > span {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.compress-strength-control output,
.compress-resize-control output {
  color: var(--cyan);
  font-variant-numeric: tabular-nums;
}

.compress-strength-control input,
.compress-resize-control input,
.compress-resize-control select {
  width: 100%;
}

.compress-strength-control small,
.compress-resize-control small {
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
  line-height: 1.45;
}

.compress-format-hint {
  margin: -5px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.45;
}

.compress-folder-status {
  margin: 0;
  text-align: center;
  overflow-wrap: anywhere;
}

.compress-simple-note {
  display: grid;
  gap: 8px;
}

.compress-simple-note h2 {
  margin-bottom: 3px;
}

.compress-simple-note span {
  position: relative;
  padding-left: 14px;
  color: #b9d7ff;
  font-size: 11px;
  line-height: 1.5;
}

.compress-simple-note span::before {
  content: "";
  position: absolute;
  left: 1px;
  top: 7px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--cyan);
}

.compress-options > label small {
  color: var(--muted);
  font-size: 10px;
  line-height: 1.45;
}

.compress-range-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 52px;
  gap: 10px;
  align-items: center;
}

.compress-range-row output {
  color: var(--cyan);
  text-align: right;
  font-weight: 800;
}

.compress-size-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.compress-size-grid label {
  display: grid;
  gap: 7px;
}

.compress-resize-group > p {
  grid-column: 1 / -1;
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

#percentSizeOptions > label {
  display: grid;
  gap: 7px;
}

.compress-check-row,
.compress-color-row {
  min-height: 38px;
  display: flex !important;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 10px;
  border: 1px solid #24486f;
  border-radius: 6px;
  background: #0b1628;
}

.compress-check-row input {
  order: 2;
}

.compress-color-row input {
  width: 46px;
  height: 28px;
}

.compress-option-note {
  margin: 0;
  display: grid;
  gap: 5px;
  padding: 10px;
  border: 1px solid #24486f;
  border-radius: 6px;
  background: #0b1628;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.55;
}

.compress-option-note strong {
  color: #cce6ff;
  font-size: 11px;
}

.compress-actions {
  display: grid;
  gap: 9px;
}

.compress-actions button {
  width: 100%;
}

.compress-progress {
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: #07101f;
}

.compress-progress span {
  width: 0;
  height: 100%;
  display: block;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  transition: width 160ms ease;
}

@media (max-width: 1180px) {
  .compress-app {
    height: auto;
    min-height: calc(100vh - 44px);
    overflow: visible;
  }

  .compress-workspace {
    grid-template-columns: 260px minmax(0, 1fr);
  }

  .compress-settings-panel {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    border-top: 1px solid var(--line);
    border-left: 0;
  }

  .compress-simple-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .compress-settings-panel .settings-panel + .settings-panel {
    margin-top: 0;
  }
}

@media (max-width: 760px) {
  .compress-workspace,
  .compress-settings-panel,
  .compress-preview-grid {
    grid-template-columns: 1fr;
  }

  .compress-queue-panel {
    max-height: 480px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .compress-preview-header {
    align-items: flex-start;
  }

  .compress-preview-title-row,
  .compress-preview-toolbar-row {
    width: 100%;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .compress-preview-stats {
    justify-content: flex-start;
  }

  .compress-settings-panel {
    grid-column: auto;
  }
}

/* Standalone frame animation editor */
.frame-tool-app {
  width: min(1540px, calc(100vw - 24px));
}

.frame-open-actions input[type="file"] {
  display: none;
}

.frame-multi-file {
  min-width: 142px;
  min-height: 44px;
  cursor: pointer;
  font-weight: 700;
}

.frame-workspace {
  display: grid;
  grid-template-columns: minmax(620px, 1fr) 300px;
  grid-template-rows: minmax(560px, calc(100vh - 250px)) auto;
  border-inline: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: #0d1a31;
}

.frame-main-panel {
  min-width: 0;
  display: grid;
  grid-template-rows: auto minmax(360px, 1fr) auto;
  gap: 10px;
  padding: 14px;
  border-right: 1px solid var(--line);
}

.frame-toolbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 12px;
  border: 1px solid #24486f;
  border-radius: 8px;
  background: #0d1c34;
}

.frame-source-settings,
.frame-playback-settings {
  display: flex;
  align-items: end;
  gap: 9px;
}

.frame-toolbar label {
  width: 78px;
}

.frame-toolbar label input {
  height: 34px;
}

.frame-preview-stage {
  position: relative;
  min-height: 360px;
  overflow: hidden;
  border: 1px solid #2d5b89;
  border-radius: 8px;
  background:
    linear-gradient(45deg, #253850 25%, transparent 25%),
    linear-gradient(-45deg, #253850 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #253850 75%),
    linear-gradient(-45deg, transparent 75%, #253850 75%);
  background-color: #17253c;
  background-position: 0 0, 12px 0, 12px -12px, 0 12px;
  background-size: 24px 24px;
  outline: none;
}

.frame-preview-stage:focus-visible,
.frame-preview-stage.dragover {
  border-color: var(--cyan);
  box-shadow: inset 0 0 0 1px var(--cyan);
}

.frame-preview-stage #previewCanvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}

.frame-preview-stage #previewCanvas.is-dragging {
  cursor: grabbing;
}

.frame-preview-stage .empty-state.is-hidden {
  display: none;
}

.frame-statusbar {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  color: var(--muted);
  font-size: 12px;
}

.frame-statusbar span:first-child {
  color: #b9d7ff;
  font-weight: 700;
}

.frame-inspector {
  display: grid;
  align-content: start;
  gap: 12px;
  padding: 14px;
  background: var(--panel);
}

.frame-adjust-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.frame-adjust-subtitle {
  margin: 16px 0 10px;
  padding-top: 12px;
  border-top: 1px solid #284e78;
  color: #b9d7ff;
  font-size: 13px;
}

.frame-color-grid label:last-child {
  grid-column: 1 / -1;
}

.frame-color-grid label {
  min-width: 0;
}

.frame-color-grid input[type="range"] {
  display: block;
  width: 100%;
  margin-top: 10px;
}

.frame-color-grid output {
  min-width: 48px;
  color: #edf6ff;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.frame-wide-button {
  width: 100%;
  margin-top: 10px;
}

.frame-export-panel .section-title span {
  color: var(--muted);
  font-size: 12px;
}

.frame-align-panel .section-title span {
  color: var(--muted);
  font-size: 12px;
}

.frame-list-panel {
  grid-column: 1 / -1;
  min-width: 0;
  padding: 14px;
  border-top: 1px solid var(--line);
  background: #0d1a31;
}

.frame-list-panel .section-title {
  margin-bottom: 10px;
}

.frame-list-panel .section-title p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

#frameCount {
  color: var(--muted);
  font-size: 13px;
}

.frame-order-list {
  min-height: 132px;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 154px;
  gap: 10px;
  overflow-x: auto;
  padding: 2px 2px 8px;
}

.frame-list-empty {
  min-width: calc(100vw - 84px);
  display: grid;
  place-items: center;
  border: 1px dashed #31577e;
  border-radius: 8px;
  color: var(--muted);
  background: #0d1c34;
}

.frame-order-card {
  position: relative;
  min-width: 154px;
  height: 126px;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) 20px;
  grid-template-rows: 72px 20px 16px;
  gap: 3px 7px;
  align-items: center;
  padding: 8px;
  border: 1px solid #284e78;
  border-radius: 8px;
  color: var(--text);
  background: #132746;
  text-align: left;
  user-select: none;
  cursor: pointer;
}

.frame-order-card:hover {
  border-color: #3a6fa4;
  background: #173055;
}

.frame-order-card.is-active {
  border-color: var(--cyan);
  box-shadow: inset 0 0 0 1px rgba(39, 184, 255, 0.28);
}

.frame-order-card.is-dragging {
  opacity: 0.35;
}

.frame-order-card.is-drop-target {
  border-color: #f0a321;
  transform: translateY(-2px);
}

.frame-order-card img {
  width: 100%;
  height: 72px;
  grid-column: 2;
  object-fit: contain;
  border-radius: 5px;
  background:
    linear-gradient(45deg, #d8dee9 25%, transparent 25%),
    linear-gradient(-45deg, #d8dee9 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #d8dee9 75%),
    linear-gradient(-45deg, transparent 75%, #d8dee9 75%);
  background-color: #f8fafc;
  background-position: 0 0, 6px 0, 6px -6px, 0 6px;
  background-size: 12px 12px;
  pointer-events: none;
}

.frame-order-number {
  grid-column: 1;
  grid-row: 1;
  align-self: start;
  color: var(--cyan);
  font-size: 11px;
  font-weight: 800;
}

.frame-order-name,
.frame-order-offset {
  grid-column: 1 / -1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.frame-order-name {
  font-size: 12px;
  font-weight: 700;
}

.frame-order-offset {
  color: var(--muted);
  font-size: 11px;
}

.frame-order-grip {
  position: absolute;
  top: 10px;
  right: 43px;
  color: #7290b2;
  font-size: 15px;
  letter-spacing: -4px;
}

.frame-delete-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 34px;
  min-width: 34px;
  height: 24px;
  min-height: 24px;
  padding: 0;
  border-color: #8f4052;
  border-radius: 5px;
  color: #ffb7c3;
  background: #482033;
  font-size: 11px;
  font-weight: 700;
}

.frame-delete-btn:hover {
  border-color: #ff657b;
  color: #fff;
  background: #8f3041;
}

@media (max-width: 1040px) {
  .frame-workspace {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }

  .frame-main-panel {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .frame-inspector {
    grid-template-columns: 1fr 1fr;
  }

  .frame-list-panel {
    grid-column: 1;
  }
}

@media (max-width: 700px) {
  .frame-toolbar,
  .frame-statusbar {
    align-items: stretch;
    flex-direction: column;
  }

  .frame-source-settings,
  .frame-playback-settings {
    flex-wrap: wrap;
  }

  .frame-inspector {
    grid-template-columns: 1fr;
  }
}

.frame-thumb {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 22px;
  gap: 8px;
  align-items: center;
  min-height: 60px;
  padding: 7px;
  border: 1px solid #284e78;
  border-radius: 7px;
  background: #132746;
  color: var(--text);
  text-align: left;
}

.frame-keep-checkbox {
  width: 18px;
  height: 18px;
  margin: 0;
  justify-self: center;
}

.frame-thumb.is-active {
  border-color: var(--cyan);
  background: #17365b;
}

.frame-thumb.is-skipped {
  opacity: 0.48;
}

.frame-thumb img {
  width: 48px;
  height: 48px;
  object-fit: contain;
  border-radius: 5px;
  background-color: #f8fafc;
}

.frame-thumb strong,
.frame-thumb span {
  display: block;
}

.frame-thumb span {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.settings {
  display: grid;
  grid-template-columns: minmax(420px, 1.15fr) minmax(320px, 0.85fr);
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  background: #0d1a31;
  border-radius: 8px;
  overflow: visible;
}

.stage-panel > .settings {
  margin-top: 12px;
}

.settings-panel {
  padding: 14px;
  border: 1px solid #284e78;
  border-radius: 8px;
  background: #10203a;
}

.settings-grid {
  grid-template-columns: repeat(2, minmax(150px, 1fr));
  gap: 12px 14px;
}

.settings-panel:first-child .settings-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px 18px;
}

.matte-title-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-left: auto;
  white-space: nowrap;
}

.matte-title-actions .compact-btn {
  min-width: 74px;
}

.matte-title-actions .switch {
  flex: 0 0 auto;
}

.settings-panel:first-child .settings-grid > label {
